services:
  rekart-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rekart-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - ENABLE_V2_MODULES=${ENABLE_V2_MODULES:-false}
      - JWT_SECRET=${JWT_SECRET:-change_this_local_compose_jwt_secret_key}
      - STORAGE_MODE=local
      - LOCAL_UPLOAD_DIR=/app/uploads
      - DATA_FILE_PATH=/app/.data/rekart-db.json
      - DEFAULT_CITY=nagpur
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/.data

volumes:
  uploads_data:
  db_data:

name: Rekart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check backend and frontend scripts
        run: |
          node --check src/index.js
          node --check src/app.js
          node --check src/services/decision/decision_engine.js
          node --check public/rekart-api.js
          node --check public/rekart-features.js
          node --check public/app.js

      - name: Run test suite
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev
